name: tark_peer
description: Random voice call app - Tark Peer

publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.5.6
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  web_socket_channel: ^2.4.0
  go_router: ^14.1.4
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  http: ^1.2.0
  flutter_foreground_task: ^8.14.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  confetti: ^0.7.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/tark_peer_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/tark_peer_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logos/
    - assets/tark_peer_icon.png
    - assets/Tark-pear-logo-change.png
